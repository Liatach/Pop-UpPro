<text x="6" y="218.00" font-size="4.5" font-weight="bold" font-family="sans-serif" fill="#333333">Assembly: parts and where they glue</text>
<rect x="6" y="221.00" width="4" height="4" fill="#e8d5a3" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="224.00" font-size="3.2" font-family="sans-serif" fill="#333333">1. Asymmetric V-fold 1 (sheet 2): tabs glue to the card. Glue markers for its back are on sheet 2 reverse.</text>
<rect x="6" y="226.00" width="4" height="4" fill="#b9d7c4" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="229.00" font-size="3.2" font-family="sans-serif" fill="#333333">2. Stand-up 1 (sheet 2): tabs glue to the card. Glue markers for its back are on sheet 2 reverse.</text>
<rect x="6" y="231.00" width="4" height="4" fill="#c9c3e6" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="234.00" font-size="3.2" font-family="sans-serif" fill="#333333">3. Stand-up 1 bridge (sheet 3): tabs glue to Asymmetric V-fold 1, the back of Stand-up 1.</text>
<rect x="6" y="236.00" width="4" height="4" fill="#f2bfb0" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="239.00" font-size="3.2" font-family="sans-serif" fill="#333333">4. Box fold 1 (sheet 2): tabs glue to the back of Stand-up 1, the card. Glue markers for its back are on sheet 2 reverse.</text>
<rect x="6" y="241.00" width="4" height="4" fill="#b7d3e8" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="244.00" font-size="3.2" font-family="sans-serif" fill="#333333">5. Cube 1 (sheet 2): tabs glue to the card.</text>
<rect x="6" y="246.00" width="4" height="4" fill="#e3c9dc" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="249.00" font-size="3.2" font-family="sans-serif" fill="#333333">6. Stand-up 2 (sheet 2): tabs glue to the card. Glue markers for its back are on sheet 2 reverse.</text>
<rect x="6" y="251.00" width="4" height="4" fill="#d9e3b0" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="254.00" font-size="3.2" font-family="sans-serif" fill="#333333">7. Stand-up 2 bridge (sheet 3): tabs glue to the back of Asymmetric V-fold 1, the back of Stand-up 2.</text>
<rect x="6" y="256.00" width="4" height="4" fill="#e8d5a3" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="259.00" font-size="3.2" font-family="sans-serif" fill="#333333">8. Box fold 2 (sheet 2): tabs glue to the back of Box fold 1, the card.</text>
<rect x="6" y="261.00" width="4" height="4" fill="#b9d7c4" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="264.00" font-size="3.2" font-family="sans-serif" fill="#333333">9. Stand-up 3 (sheet 2): tabs glue to the card. Glue markers for its back are on sheet 2 reverse.</text>
<rect x="6" y="266.00" width="4" height="4" fill="#c9c3e6" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="269.00" font-size="3.2" font-family="sans-serif" fill="#333333">10. Stand-up 3 bridge (sheet 3): tabs glue to Asymmetric V-fold 1, the back of Stand-up 3.</text>
<rect x="6" y="271.00" width="4" height="4" fill="#f2bfb0" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="274.00" font-size="3.2" font-family="sans-serif" fill="#333333">11. Asymmetric V-fold 2 (sheet 3): tabs glue to Stand-up 3, the card.</text>
<rect x="6" y="276.00" width="4" height="4" fill="#b7d3e8" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="279.00" font-size="3.2" font-family="sans-serif" fill="#333333">12. Asymmetric V-fold 3 (sheet 3): tabs glue to Stand-up 3, the card.</text>
<rect x="6" y="281.00" width="4" height="4" fill="#e3c9dc" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="284.00" font-size="3.2" font-family="sans-serif" fill="#333333">13. Asymmetric V-fold 4 (sheet 3): tabs glue to Stand-up 3, the card.</text>
<rect x="6" y="286.00" width="4" height="4" fill="#d9e3b0" stroke="#6b6b6b" stroke-width="0.2"/>
<text x="12" y="289.00" font-size="3.2" font-family="sans-serif" fill="#333333">14. Box fold 3 (sheet 3): tabs glue to Asymmetric V-fold 1, the card.</text>
